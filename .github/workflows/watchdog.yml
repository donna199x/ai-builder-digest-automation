name: Digest Watchdog

on:
  schedule:
    - cron: "11 1-15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backfill today's digest if missing
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: ${{ vars.GITHUB_MODEL || 'openai/gpt-4.1-mini,openai/gpt-4.1' }}
          TIMEZONE: Asia/Shanghai
          SKIP_IF_EXISTS: "1"
        run: npm run run
